<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETQAN - احجز موعدك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A227;
    --gold-light: #F0D070;
    --gold-dark: #9A7A1A;
    --teal: #1A5F6E;
    --teal-light: #2A8FA5;
    --teal-dark: #0D3D47;
    --bg: #0D2B35;
    --bg2: #112F3A;
    --card: rgba(255,255,255,0.06);
    --card-border: rgba(201,162,39,0.25);
    --white: #ffffff;
    --text-muted: rgba(255,255,255,0.65);
    --radius: 14px;
    --input-bg: rgba(255,255,255,0.08);
    --input-border: rgba(201,162,39,0.3);
    --input-focus: rgba(201,162,39,0.7);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
    direction: rtl;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(26,95,110,0.35) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,162,39,0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .page-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease;
  }
  .logo-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 36px;
    box-shadow: 0 0 30px rgba(201,162,39,0.4);
  }
  .header h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }
  .header p {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .form-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 520px;
    width: 100%;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: fadeUp 0.7s ease;
  }

  .field-group { margin-bottom: 20px; }
  .field-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--gold-light);
    margin-bottom: 8px;
  }
  .field-group label span.req { color: #ff6b6b; margin-right: 3px; }

  input[type="text"],
  input[type="tel"],
  select {
    width: 100%;
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: var(--radius);
    padding: 13px 16px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    color: var(--white);
    direction: rtl;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.3); }
  input:focus, select:focus {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 3px rgba(201,162,39,0.12);
  }
  select option { background: #1a3a45; color: white; }

  .discount-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .discount-row input { flex: 1; }
  .btn-apply {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: var(--teal-dark);
    border: none;
    border-radius: var(--radius);
    padding: 0 22px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn-apply:hover { opacity: 0.9; }
  .btn-apply:active { transform: scale(0.97); }

  .price-box {
    background: rgba(201,162,39,0.08);
    border: 1px solid rgba(201,162,39,0.2);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    margin-bottom: 6px;
    color: var(--text-muted);
  }
  .price-final {
    font-size: 20px;
    font-weight: 800;
    color: var(--gold-light);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .price-final .currency { font-size: 14px; color: var(--gold); }

  .payment-title {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 12px;
    font-weight: 600;
  }
  .payment-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .radio-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .radio-option:hover { border-color: var(--gold); background: rgba(201,162,39,0.05); }
  .radio-option input[type="radio"] {
    width: 18px; height: 18px;
    accent-color: var(--gold);
    cursor: pointer;
  }
  .radio-option.selected {
    border-color: var(--gold);
    background: rgba(201,162,39,0.1);
  }
  .radio-label { font-size: 14px; font-weight: 600; }
  .radio-badge {
    margin-right: auto;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .badge-tamara { background: rgba(100,200,100,0.15); color: #7dde7d; border: 1px solid rgba(125,222,125,0.3); }

  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: var(--teal-dark);
    border: none;
    border-radius: var(--radius);
    padding: 16px;
    font-family: 'Cairo', sans-serif;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;

<!--
══════════════════════════════════════════════════════════════
📋 GOOGLE SHEETS + EMAIL SETUP GUIDE
══════════════════════════════════════════════════════════════

STEP 1: Create a Google Sheet
  1. Go to sheets.google.com
  2. Create a new sheet called "Bookings"
  3. In Row 1, add these headers:
     A1: Timestamp   B1: Name   C1: Phone   D1: WhatsApp
     E1: Offer       F1: Branch G1: Nationality  H1: Discount Code
     I1: Discount %  J1: Final Price  K1: Payment Method

STEP 2: Create Google Apps Script
  1. In the Sheet, go to Extensions → Apps Script
  2. Delete any existing code and paste this:

─────────────────────────────────────────────
function doPost(e) {
  const sheet = SpreadsheetApp.getActiveSheet();
  const data = JSON.parse(e.postData.contents);

  sheet.appendRow([
    data.timestamp,
    data.name,
    data.phone,
    data.whatsapp,
    data.offer,
    data.branch,
    data.nationality,
    data.discountCode,
    data.discountPercent,
    data.finalPrice,
    data.payment
  ]);

  // Send email notification
  const emailBody = `
📅 حجز جديد - ابتسامة النجوم
━━━━━━━━━━━━━━━━━━━
الاسم: ${data.name}
الجوال: ${data.phone}
واتساب: ${data.whatsapp}
العرض: ${data.offer}
الفرع: ${data.branch}
الجنسية: ${data.nationality}
كود الخصم: ${data.discountCode}
نسبة الخصم: ${data.discountPercent}
السعر النهائي: ${data.finalPrice}
طريقة الدفع: ${data.payment}
التاريخ: ${data.timestamp}
  `;

  MailApp.sendEmail({
    to: data.notifyEmail,
    subject: "📅 حجز جديد: " + data.name + " - " + data.offer.substring(0, 30),
    body: emailBody
  });

  return ContentService.createTextOutput(
    JSON.stringify({ status: "success" })
  ).setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  return ContentService.createTextOutput("OK");
}

STEP 3: Deploy as Web App
  1. Click "Deploy" → "New Deployment"
  2. Type: "Web App"
  3. Execute as: "Me"
  4. Who has access: "Anyone"
  5. Click "Deploy" → Copy the Web App URL

STEP 4: Update this HTML file
  1. Find CONFIG at the top of the <script> section
  2. Replace "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE" with your URL
  3. Replace "YOUR_EMAIL@gmail.com" with your email

Done! Every booking will be saved to your sheet AND emailed to you.
